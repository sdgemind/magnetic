<!doctype html>
<html lang="zh-CN">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>右手螺旋定则 · 交互动画</title>
  <style>
  :root{
    --ink:#1e293b;
    --ink2:#64748b;
    --ink3:#94a3b8;
    --line:#dde5f0;
    --card:rgba(255,255,255,.82);
    --blue:#2563eb;
    --cyan:#0891b2;
    --amber:#f59e0b;
    --r:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1100px 760px at 18% -6%, #ffffff 0%, #eef3fb 42%, #e4ebf7 100%);
    overflow:hidden;
    user-select:none;
  }
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;}
  #scene.grabbing{cursor:grabbing;}

  .card{
    position:fixed;
    background:var(--card);
    -webkit-backdrop-filter:blur(14px) saturate(1.4);
    backdrop-filter:blur(14px) saturate(1.4);
    border:1px solid rgba(255,255,255,.9);
    box-shadow:0 10px 30px -12px rgba(30,58,110,.28), 0 2px 8px -4px rgba(30,58,110,.12);
    border-radius:var(--r);
  }

  /* ---- 标题 ---- */
  .title{top:22px;left:24px;padding:14px 20px 15px;}
  .title h1{margin:0;font-size:19px;letter-spacing:.5px;font-weight:700;}
  .title h1 .dot{color:var(--amber);}
  .title p{margin:5px 0 0;font-size:12px;color:var(--ink2);letter-spacing:.3px;}

  /* ---- 控制面板 ---- */
  .panel{
    top:22px;right:24px;width:272px;padding:6px 16px 16px;
    max-height:calc(100vh - 44px);overflow-y:auto;
  }
  .panel::-webkit-scrollbar{width:6px}
  .panel::-webkit-scrollbar-thumb{background:#cfd9e8;border-radius:3px}
  .ph{
    font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:1.6px;
    padding:12px 2px 10px;position:sticky;top:0;background:linear-gradient(#fff 72%,rgba(255,255,255,0));
    margin:0 -2px 2px;z-index:2;
  }
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 2px;}
  .row.col{display:block;}
  .lb{font-size:12.5px;color:#334155;font-weight:600;}
  .lb-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .val{font-size:12px;color:var(--blue);font-weight:700;font-variant-numeric:tabular-nums;}
  .divider{height:1px;background:var(--line);margin:6px 0;}

  /* 分段按钮 */
  .seg{display:flex;gap:0;border:1px solid var(--line);border-radius:10px;padding:3px;background:#f3f6fb;}
  .seg button{
    flex:1;border:0;background:transparent;padding:7px 6px;border-radius:7px;cursor:pointer;
    font-size:12px;font-weight:600;color:var(--ink2);font-family:inherit;transition:.18s;white-space:nowrap;
  }
  .seg button:hover{color:var(--ink);}
  .seg button.on{
    background:#fff;color:var(--blue);
    box-shadow:0 1px 4px -1px rgba(37,99,235,.35), 0 0 0 1px rgba(37,99,235,.14);
  }
  .seg.full{margin-top:8px;}

  /* 滑块 */
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;outline:none;
    background:linear-gradient(90deg,var(--blue),#60a5fa);margin:4px 0 2px;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;cursor:pointer;
    border:2.5px solid var(--blue);box-shadow:0 2px 6px -1px rgba(37,99,235,.5);
  }
  input[type=range]::-moz-range-thumb{
    width:14px;height:14px;border-radius:50%;background:#fff;border:2.5px solid var(--blue);cursor:pointer;
  }

  /* 开关 */
  .sw{
    width:40px;height:23px;border-radius:12px;background:#d7dfeb;border:0;position:relative;cursor:pointer;
    transition:background .2s;flex:0 0 auto;padding:0;
  }
  .sw::after{
    content:"";position:absolute;top:2.5px;left:2.5px;width:18px;height:18px;border-radius:50%;
    background:#fff;box-shadow:0 1px 3px rgba(15,23,42,.28);transition:transform .2s cubic-bezier(.4,1.6,.5,1);
  }
  .sw.on{background:var(--blue);}
  .sw.on::after{transform:translateX(17px);}

  .playbtn{
    width:100%;margin-top:12px;padding:10px;border:0;border-radius:11px;cursor:pointer;
    font-family:inherit;font-size:13px;font-weight:700;color:#fff;letter-spacing:.5px;
    background:linear-gradient(135deg,#2563eb,#3b82f6);
    box-shadow:0 6px 16px -6px rgba(37,99,235,.7);transition:.18s;
  }
  .playbtn:hover{filter:brightness(1.07);transform:translateY(-1px);}
  .playbtn:active{transform:translateY(0);}
  .playbtn.paused{background:linear-gradient(135deg,#475569,#64748b);box-shadow:0 6px 16px -6px rgba(71,85,105,.6);}

  /* ---- 说明卡 ---- */
  .info{left:24px;bottom:22px;width:330px;padding:16px 18px 15px;}
  .info-t{font-size:13.5px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:7px;}
  .info-t::before{content:"";width:3px;height:14px;border-radius:2px;background:linear-gradient(var(--blue),var(--cyan));}
  .info p{margin:0;font-size:12.5px;line-height:1.75;color:#475569;}
  .info b{color:#1d4ed8;font-weight:700;}
  .info b.am{color:#d97706;}
  .formula{
    margin-top:11px;padding:9px 12px;border-radius:10px;
    background:linear-gradient(135deg,rgba(37,99,235,.07),rgba(8,145,178,.07));
    border:1px solid rgba(37,99,235,.14);
    font-family:"Cambria Math",Georgia,"Times New Roman",serif;
    font-size:15px;text-align:center;color:#1e40af;letter-spacing:.6px;
  }
  .formula i{font-style:italic;}
  .fnote{margin-top:8px;font-size:11.5px;color:var(--ink3);line-height:1.6;}

  /* ---- 右下角转动盘：按住拖动 = 画面在屏幕平面内转动（把导线放平） ---- */
  .dial{
    position:fixed;right:24px;bottom:24px;width:92px;height:112px;z-index:3;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    padding:5px 5px 6px;border-radius:20px;cursor:grab;touch-action:none;
    user-select:none;-webkit-user-select:none;
    background:rgba(255,255,255,.72);
    -webkit-backdrop-filter:blur(12px) saturate(1.3);backdrop-filter:blur(12px) saturate(1.3);
    border:1px solid rgba(255,255,255,.9);
    box-shadow:0 10px 26px -14px rgba(30,58,110,.35);
  }
  .dial:active{cursor:grabbing;}
  .dial svg{width:76px;height:76px;display:block;}
  .dial-t{font-size:10.5px;font-weight:700;color:var(--blue);letter-spacing:.4px;}

  .hint{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    font-size:11.5px;color:var(--ink3);letter-spacing:.4px;
    background:rgba(255,255,255,.6);padding:6px 14px;border-radius:20px;
    border:1px solid rgba(255,255,255,.9);backdrop-filter:blur(8px);pointer-events:none;
    max-width:min(88vw,660px);text-align:center;line-height:1.6;
  }

  @media (max-width:900px){
    .info{width:290px;}
    .panel{width:240px;}
  }
  @media (max-width:1040px){ .dial{display:none;} }
  @media (max-width:760px){
    .info{display:none;}
    .title{left:14px;top:14px;padding:10px 14px 11px;}
    .title h1{font-size:16px;}
    .title p{display:none;}
    .panel{
      top:auto;bottom:12px;left:12px;right:12px;width:auto;
      max-height:56vh;padding:2px 16px 14px;
    }
    .panel .row{padding:6px 2px;}
    .playbtn{margin-top:10px;padding:9px;}
    .ph{padding:10px 2px 8px;}
    .hint{display:none;}
  }
  @media (max-height:560px){ .info{display:none;} }

     <button data-v="0" class="on">竖直 ⇅</button> <button data-v="90">横放 ⇄<img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAB4AAAAhCAIAAABBfoyNAAAAjklEQVR42u2UUQqAMAxDe/9DN+LXRpe0Vb+EliGuuJeRZRru8u1Jp+F978gy1nQ9wKag2sYWhM65cWix1bfja1RrcjcIumlCLhzRiXfOHOgIL6+/DJWcAo2e6Z4kpHNurnNCA8ZzDbFrVDH3Tq79ycUp0GVOlfU4QoLckFKg/o000W9q0IMe9KAHPehfoi9Gj44MnlRXVQAAAABJRU5ErkJggg==" style="position: absolute; left: -99999px; top: -99999px; opacity: 0; pointer-events: none; width: 1px; height: 1px;"></button>

  <div class="card info">
   <div class="info-t">

   </div>
   <p>用右手握住通电导线，让<b class="am">拇指指向电流 I 的方向</b>，那么<b>四指弯曲的方向</b>就是磁感线环绕的方向（磁感应强度 <i>B</i> 的方向）。</p>
   <div class="formula">

    磁感线是以导线为圆心的一系列同心圆，每个圆都在与导线垂直的平面内；

   <b>横拖</b>环绕 · <b>竖拖</b>俯仰 · 拖右下<b>转向盘</b>或按 <b>Shift</b>/<b>右键</b>拖动、<b>Q/E</b> 可把导线转成水平 · 滚轮缩放 · 双击复位
  </div>
  <div class="dial" id="dial" title="按住拖动，画面跟着转">
   <svg viewBox="0 0 96 96" aria-hidden="true">
    <circle cx="48" cy="48" r="40" fill="none" stroke="rgba(37,99,235,.18)" stroke-width="1.4" stroke-dasharray="3 4" /> <g id="dialBar">
     <rect x="43.2" y="9" width="9.6" height="78" rx="4.8" fill="#fff" stroke="rgba(37,99,235,.30)" stroke-width="1.2" />
     <rect x="45.6" y="14" width="4.8" height="68" rx="2.4" fill="#556580" />
     <circle cx="48" cy="12.6" r="7.4" fill="#2563eb" />
     <path d="M45.6 12.6h4.8M48 10.2v4.8" stroke="#fff" stroke-width="1.6" stroke-linecap="round" />
    </g> <circle cx="48" cy="48" r="4.4" fill="#2563eb" />
   </svg>

  <script>
(function(){
'use strict';

/* ============================ 基础数学 ============================ */
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const mul=(a,k)=>[a[0]*k,a[1]*k,a[2]*k];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const nrm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l];};
const D2R=Math.PI/180;

/* ============================ 画布 & 相机 ============================ */
const cvs=document.getElementById('scene');
const ctx=cvs.getContext('2d');
let W=800,H=600,DPR=1;

/* roll = 绕视线轴的滚转。只有 yaw/pitch 的轨道相机会把世界竖直方向永远
   投影成屏幕竖直方向，导线因此只能是竖的；加上 roll 才能让导线转到水平。*/
const cam={ yaw:1.28, pitch:0.30, roll:0, pitchT:0.30, rollT:0, dist:8.6, fov:640, oy:0 };
let camPos=[0,0,8.6], BX=[1,0,0], BY=[0,1,0], BZ=[0,0,-1];

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=cvs.clientWidth; H=cvs.clientHeight;
  cvs.width=Math.round(W*DPR); cvs.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const narrow = W<760;                 /* 窄屏：面板移到底部，场景上移 */
  cam.fov = narrow ? Math.min(H*0.62, W*1.15) : Math.min(H*0.82, W*1.15);
  cam.oy  = narrow ? -H*0.20 : 0;
}
window.addEventListener('resize',resize);

function updateCam(){
  const cp=Math.cos(cam.pitch), sp=Math.sin(cam.pitch);
  const cy=Math.cos(cam.yaw),  sy=Math.sin(cam.yaw);
  camPos=[cam.dist*cp*sy, cam.dist*sp, cam.dist*cp*cy];
  const f=nrm(mul(camPos,-1));
  /* 视线与导线轴重合时（pitch = ±90°）cross(f,[0,1,0]) 退化为零向量，
     改用由方位角定义的右向量 —— 它就是该极限的解析值。
     符号要注意：俯仰越过 ±90° 之后 cos(pitch) 变负，右向量要跟着翻号
     （相机是真穿了极点）；配合 trackPole() 的滚转补偿，画面才全程连续。 */
  const r0 = (Math.abs(f[1])>0.999995) ? (cp>=0?[cy,0,-sy]:[-cy,0,sy]) : nrm(cross(f,[0,1,0]));
  const u0 = cross(r0,f);
  /* 绕视线轴滚转 roll：得到新的右向量与上向量（r'×u' 仍等于 f，保持右手系）。
     roll=90° 时世界 +y 会落到屏幕水平方向上，也就是导线横躺。 */
  const cr=Math.cos(cam.roll), sr=Math.sin(cam.roll);
  BX=[r0[0]*cr+u0[0]*sr, r0[1]*cr+u0[1]*sr, r0[2]*cr+u0[2]*sr];
  BY=[u0[0]*cr-r0[0]*sr, u0[1]*cr-r0[1]*sr, u0[2]*cr-r0[2]*sr];
  BZ=f;
}
function project(p){
  const dx=p[0]-camPos[0], dy=p[1]-camPos[1], dz=p[2]-camPos[2];
  const x=dx*BX[0]+dy*BX[1]+dz*BX[2];
  const y=dx*BY[0]+dy*BY[1]+dz*BY[2];
  const z=dx*BZ[0]+dy*BZ[1]+dz*BZ[2];
  const depth=z;                       /* BZ 为相机朝向原点的前向单位向量 */
  if(depth<0.2) return null;
  const s=cam.fov/depth;
  return {x:W/2+x*s, y:H/2-y*s+cam.oy, s:s, depth:depth};
}

/* ============================ 图元系统 ============================ */
let prims=[];
const SLATE='#475569', SLATE_L='#94a3b8';
const BLUE='#2f6fe4', BLUE_L='#5b9bf8';
const AMBER='#f59e0b', AMBER_L='#fbbf24';

function seg(a,b,w,c,opt){
  if(!a||!b) return;
  if(opt&&opt.dash){ segDash(a,b,w,c,(opt.alpha===undefined?1:opt.alpha),opt.ph); return; }
  prims.push({t:0,a:a,b:b,w:w,c:c,d:(a.depth+b.depth)/2,glow:(opt&&opt.glow)||null,alpha:(opt&&opt.alpha)||1});
}
/* --- 虚线段（教材画法：被挡住的绕组用短划线） ---------------------------
   渲染器是一条线段一个图元、逐段 stroke 的：直接给 ctx 上 setLineDash 的话，
   每段的相位都从头开始，而一段投影后也就一二十像素，根本连不成虚线。
   所以自己切：把这一段打成 ≤3.4px 的小截，按**屏幕累积弧长**（ph 传入）决定
   每个小截落在实段还是空隙里 —— 图案跨段连续，看着才是均匀的短划线，
   不会每段都从「实」重新开始、变成一节一节的点。 */
function segDash(a,b,w,c,alpha,ph0){
  const dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy);
  if(L<0.8) return;
  const PER=13.5, ON=8.2;                       /* 一个周期 13.5px：实 8.2 + 空 5.3 */
  const ph=(((ph0||0)%PER)+PER)%PER;
  const ds=a.depth, de=b.depth, ss=a.s, se=b.s;
  const at=t=>({x:a.x+dx*t,y:a.y+dy*t,s:ss+(se-ss)*t,depth:ds+(de-ds)*t});
  const g1=ph+L;
  for(let k=Math.floor(ph/PER); k*PER<g1; k++){
    let s0=k*PER-ph, s1=s0+ON;                  /* 实段在 [0,L] 里的区间 */
    if(s1<=0) continue;                         /* 这一段整个落在空隙里 */
    if(s0<0) s0=0;
    if(s0>=L) break;
    if(s1>L) s1=L;
    const A=at(s0/L), B=at(s1/L);
    prims.push({t:0,a:A,b:B,w:w,c:c,d:(A.depth+B.depth)/2,glow:null,alpha:alpha});
  }
}
function tri(pa,pb,pc,c,a){
  if(!pa||!pb||!pc) return;
  prims.push({t:1,p:[pa,pb,pc],c:c,d:(pa.depth+pb.depth+pc.depth)/3,a:(a===undefined?1:a)});
}
function label(p,txt,c,font,a){
  if(!p) return;
  prims.push({t:2,txt:txt,c:c,d:p.depth,x:p.x,y:p.y,a:(a===undefined?1:a),
              font:font||'700 15px system-ui,-apple-system,"PingFang SC",sans-serif'});
}
/* 圆锥箭头 */
function cone(tip, dirv, length, radius, color, alpha){
  const dv=nrm(dirv);
  const base=sub(tip,mul(dv,length));
  let up=[0,1,0];
  if(Math.abs(dot(dv,up))>0.94) up=[1,0,0];
  const u1=nrm(cross(dv,up)), u2=cross(dv,u1);
  const K=12, bp=[];
  for(let i=0;i<K;i++){
    const a=i/K*Math.PI*2;
    bp.push(add(base, add(mul(u1,Math.cos(a)*radius), mul(u2,Math.sin(a)*radius))));
  }
  const pt=project(tip);
  for(let i=0;i<K;i++){
    tri(pt, project(bp[i]), project(bp[(i+1)%K]), color, alpha);
  }
}
/* --- 屏幕空间的实心箭头（三个动画共用） --------------------------------
   做法：把「箭尖」和「箭尾」两个三维点各自投影到屏幕，得到一条屏幕上的投影线，
   再沿这条投影方向在屏幕坐标里张开箭头三角形。
   为什么不画在 3D 里：三角形一旦躺在子午面（或任何切平面）内，
   斜视时那个平面被压扁，箭头在屏幕上就成了一道斜斜的「刺」——
   既不像箭，看上去也不指向线上，这就是「箭头标得不好不准确」的根源。
   屏幕空间画法保证箭头的指向 = B 在屏幕上的投影方向：任何视角都精确指在线上，
   形状也永远是标准箭头；正对视线（投影长度 < 8px）时干脆不画，
   免得退化成一个小点误导人。                                            */
function vecArrow(pos, tv, len, color, alpha, dAdj){
  const T=nrm(tv);
  const pt=project(pos), pb=project(sub(pos, mul(T, len)));
  if(!pt||!pb) return;
  const dx=pt.x-pb.x, dy=pt.y-pb.y, L=Math.hypot(dx,dy);
  /* 太短就别画：① 绝对长度不足 8px；
     ② 相对长度不足（L 比"正对屏幕时应有的长度"还小很多）—— 磁感线几乎顺着视线走，
        这时屏幕上的箭头方向已经没有意义（侧视同心圆会在两端冒出一排"沿切线"的假箭头）。 */
  const wl=len*(pt.s+pb.s)/2;
  if(L<8 || L<0.32*wl) return;
  const ux=dx/L, uy=dy/L;                     /* 屏幕上 B 的方向 */
  /* 箭头形态：细长比 长:宽 ≈ 1 : 0.84 偏瘦一点，方向才读得准
     （胖而钝的三角看着就像"歪"的）；长度全部由屏幕投影长度 L 定，
     所以世界长度短的箭头（曲率大的地方自动收短）在屏幕上也同步变小。 */
  const HL=Math.min(L*0.60, Math.max(6.0, len*pt.s*0.42));  /* 头部长度（像素） */
  const WD=HL*0.42;                           /* 头部半宽 */
  const d=pt.depth-(dAdj||0);
  const P=(x,y)=>({x:x,y:y,s:pt.s,depth:d});
  const tip  =P(pt.x, pt.y);
  const b1   =P(pt.x-ux*HL-uy*WD, pt.y-uy*HL+ux*WD);
  const b2   =P(pt.x-ux*HL+uy*WD, pt.y-uy*HL-ux*WD);
  const notch=P(pt.x-ux*HL*0.40, pt.y-uy*HL*0.40);          /* 尾部内凹 = 标准箭头轮廓 */
  tri(tip,b1,notch,color,alpha);
  tri(tip,notch,b2,color,alpha);
  seg(P(pt.x-ux*L, pt.y-uy*L), notch, 1.9/((pt.s+pb.s)/2), color, {alpha:alpha});
}

/* ============================ 状态 ============================ */
const st={ dir:1, I:1.0, showHand:true, showField:true, playing:true, t:0 };
/* 常量：RING_R 是各层磁感线的基准（最外圈）半径，实际条数随电流 I 变。
   层数 = 7：磁感线圆沿导线均匀排开，侧视时导线两侧就得到**一列 ⊙ / 一列 ⊗**
   （每层一对），与课本「导线两侧画点画叉」的图一致 —— 3 层时只有三对，太稀。
   各层半径**取同一个值**：侧视时两侧的记号才落在同一条竖线上（严格成列），
   俯视时各层圆彼此重合、不会叠出密密麻麻的一堆同心圆。 */
const NRING=7, WIRE_H=2.6,
      RING_Y=[-2.34,-1.56,-0.78,0,0.78,1.56,2.34],
      RING_R=[1.5,1.5,1.5,1.5,1.5,1.5,1.5];

/* ============================ 场景构建 ============================ */
function buildScene(){
  prims.length=0;
  const d=st.dir, I=st.I, tt=st.t;

  if(st.showField) buildField(d,I,tt);
  if(st.showHand)  buildHand(d);
  buildWire(d,I,tt);
  buildAxisMark(d);
}

/* --- 磁感线（同心圆）+ 切向箭头 ---
   电流越大 → B 越强 → 磁感线越密。课本本来就是用磁感线的疏密表示磁场强弱的，
   所以同心圆的条数随 I 变（0.2A 每层 1 条 → 2.0A 每层 4 条），线也随 I 变粗变实、
   流动更快。改电流时磁场"看得见地"变了，而不是只有动画速度变。
   半径一律从外圈往里收：外圈位置不变，多出来的线填在里面，
   这样电流变大是「变密」而不是「铺得更开」（后者会误导成磁场范围变大）。 */
function buildField(d,I,t){
  /* 箭头**固定不动**（用户要求：不必动起来，方向准就行），所以这里不再有 rot 相位。 */
  const ALEN=(0.115+0.022*I)*3.6;        /* 箭头最大世界长度（随 I 略大；小圈上会自动收短） */
  const lineW=0.019+0.013*I;             // 线也随 I 变粗
  const NC=Math.max(1,Math.min(3,1+Math.round((I-0.2)/1.8*2)));
  const PHASE=0.31;                      /* 固定相位：别让三层环的箭头排成一根辐条 */
  /* 侧视时圆环被视线压成一条直线：前后半圈的投影完全重合、方向却相反，
     同一根线上会冒出两支指向相反的箭头 —— 那就是"标歪了"的观感。
     课本在这种视角（截面图）用的是 ⊗/⊙ 记号：一侧进纸面、一侧出纸面。
     所以这里让箭头平滑淡出（sv=1 完全换成记号），方向反而更不含糊。 */
  const edge=Math.abs(BZ[1]);                              /* 视线与导线轴的夹角：0 = 正侧视 */
  /* 这里有两个程度量，**必须分开**（曾经共用一个 sv，导致"稍一拖动记号就整片消失"）：
       · sv  —— 箭头让位给记号的程度：只在接近正侧视时才退场（前后半圈投影重合，
                 同一根线上会冒出两支反向箭头）。窗口很窄是故意的。
       · svm —— ⊗/⊙ 记号的出现程度：它在什么样的视角下都读得通（椭圆的两端永远是
                 切向正对纸面的地方），所以窗口开得很宽，竖直 / 横放 / 斜视都常驻，
                 只有接近俯视、仰视（视线快与导线轴重合）时才淡出。 */
  const sv =Math.max(0,Math.min(1,(0.30-edge)/0.10));      /* 箭头让位的程度 */
  const svm=Math.max(0,Math.min(1,(0.80-edge)/0.16));      /* 记号出现的程度（约到 53° 才消失） */
  const AL=1-sv;                                           /* 箭头保留的程度 */
  /* 俯视 / 仰视（视线快与导线轴重合）时，各层圆因**透视**投影成半径略有差异的一堆圈
     （7 层 × 每层好几条 → 十几圈），叠在一起就糊了。这两个视角只保留中间那一层：
     同心圆本来就该是清爽的一组。斜视（默认 edge≈0.30）、侧视不受影响。 */
  const topFade=Math.max(0,Math.min(1,(edge-0.55)/0.20));

  RING_Y.forEach((y,ri)=>{
    const R0=RING_R[ri];
    const keep=(ri===(NRING-1)/2)?1:(1-topFade);           /* 俯视/仰视时只剩中间那一层 */
    if(keep<0.02) return;
    const col=ri===(NRING-1)/2?'#1a72d8':BLUE;      /* 正中间那层用深一号的蓝 */
    for(let j=0;j<NC;j++){
      /* 单条时保持原来的半径，多条时从外圈往里收（0.55 的等比）：
         半径拉开足够宽，相邻圈的箭头才不会叠成一条毛虫。 */
      const R=NC===1 ? R0 : R0*Math.pow(0.55,(NC-1-j)/(NC-1));
      const q=NC===1?1:j/Math.max(1,NC-1);                 /* 0=最内圈 1=最外圈 */
      const al=Math.min(0.97,(ri===(NRING-1)/2?0.95:0.84)*(0.74+0.26*q))*keep;
      /* 圆环本体 */
      const N=78, pts=[];
      for(let i=0;i<=N;i++){const a=i/N*Math.PI*2; pts.push([R*Math.cos(a),y,R*Math.sin(a)]);}
      const pr=pts.map(project);
      for(let i=0;i<N;i++) seg(pr[i],pr[i+1],lineW,col,{alpha:al});

      /* 箭头：箭尖在 a、箭尾在 a+d·Δa（沿 B 的反方向退 Δa），方向 = 这两点的弦方向，
         于是箭头两端精确落在圆上。用「该点切线 + 从箭尖往后退」画的话，箭尾会飘到圆外，
         半径越小飘得越狠（这就是"箭头有点歪"的根源）。Δa 按弧长取并封顶 20°，
         小圈自动用更短更小的箭头，绝不会切过圆心那侧。 */
      const K=Math.max(3,Math.round(2*Math.PI*R/2.9));
      const da=Math.min(ALEN/R, 20*D2R);
      if(AL>0.03)
      for(let k=0;k<K;k++){
        const a=(k/K+j*0.5)*Math.PI*2 + PHASE;
        const aT=a+d*da;                                      /* 箭尾所在的角度 */
        const pos =[R*Math.cos(a ), y, R*Math.sin(a )];
        const tail=[R*Math.cos(aT), y, R*Math.sin(aT)];
        vecArrow(pos, nrm(sub(pos,tail)),
                 Math.hypot(pos[0]-tail[0], pos[2]-tail[2]), col, al*AL, 0);
      }
      /* 侧视记号：放在圆环投影成的那条线的两端 —— 那里切向正好垂直于屏幕，
         「B 指向纸面内 / 外」最明确（正是课本截面图画点画叉的位置）。 */
      if(svm>0.03 && j===0){
        const aE=Math.atan2(BX[2],BX[0]);                     /* 屏幕上最右端对应的方位角 */
        [aE, aE+Math.PI].forEach(a=>{
          const p=project([R0*Math.cos(a), y, R0*Math.sin(a)]);
          if(!p) return;
          const fc=-Math.sin(a)*BZ[0]+Math.cos(a)*BZ[2];      /* 切向在视线方向上的分量 */
          prims.push({t:5, d:-2e6, a:svm*0.96, x:p.x, y:p.y, s:p.s,
                      style:'fld', away:(-d*fc)>0});          /* B = −d·切向：指向纸面内则 ⊗ */
        });
      }
    }
  });

  /* ⊗/⊙ 记号的图例：跟着记号一起出现（与箭头让位的窄窗口无关） */
  if(svm>0.5) prims.push({t:5, d:-3e6, a:svm, x:W/2, y:H-116, s:1, style:'fldnote'});

  /* B 标注的位置是挑出来的（见 tools 里的方位角扫描）：
       · 半径取在最外圈磁感线之外；
       · 高度取中间层与它上面那层之间 —— 侧视时各层都压成水平线，放在层平面高度上字母会压线；
       · 方位角 -30°：斜视时落在导线右侧、侧视时离导线有富余、俯视时离 ⊗/⊙ 说明文字最远。 */
  /* 半径要留在记号列**之外**（记号在 ±RING_R 处，7 层后那一列几乎连续），
     否则 B 会正好压在某个 ⊗ 上 —— 所以这里让出的余量比层数少时更大。 */
  const la=-30*D2R, rB=Math.max(...RING_R)+1.15, yB=(RING_Y[(NRING-1)/2]+RING_Y[(NRING+1)/2])/2;
  const lp=project([rB*Math.cos(la), yB, rB*Math.sin(la)]);
  label(lp,'B','#1d4ed8','italic 700 18px Georgia,"Times New Roman",serif');
}

/* --- 通电导线 + 电流 --- */
function buildWire(d,I,t){
  const N=40, pts=[];
  for(let i=0;i<=N;i++) pts.push([0,-WIRE_H+2*WIRE_H*i/N,0]);
  const pr=pts.map(project);
  /* 发光外圈 */
  for(let i=0;i<N;i++) seg(pr[i],pr[i+1],0.19,'rgba(71,85,105,.13)');
  for(let i=0;i<N;i++) seg(pr[i],pr[i+1],0.105,SLATE);
  for(let i=0;i<N;i++) seg(pr[i],pr[i+1],0.042,SLATE_L,{alpha:0.55});

  /* 流动的电流粒子 */
  const span=WIRE_H*2, spacing=0.46;
  const flow=(t*I*1.7*d)%span;
  for(let k=0;k<Math.ceil(span/spacing);k++){
    let y=-WIRE_H+k*spacing+flow;
    y=((y+WIRE_H)%span+span)%span-WIRE_H;
    const y0=y-0.085*d, y1=y+0.085*d;
    if(y0<-WIRE_H+0.2||y1>WIRE_H-0.2){
      if(y1>WIRE_H-0.2) continue;
    }
    seg(project([0,y0,0]), project([0,y1,0]), 0.115, AMBER_L);
  }

  /* 电流方向大箭头（视线接近导线轴时淡出，由 ⊗ / ⊙ 符号接管） */
  const ka=1-endOnVis();
  if(ka>0.02){
    const tipY=d*(WIRE_H+0.30);
    cone([0,tipY,0],[0,d,0],0.42,0.19,AMBER,ka);
    const lbY=d*(WIRE_H+0.72);
    label(project([0.42,lbY,0]),'I','#d97706','italic 700 19px Georgia,"Times New Roman",serif',ka);
  }
}

/* --- 沿导线轴看：叉进点出 -------------------------------------------------
   俯视（pitch=+90°）或仰视（pitch=-90°）时视线与导线轴重合，导线在屏幕上
   收缩为一点，此时用教科书符号表达电流方向：
   电流远离观察者（流入纸面）画 ⊗，电流朝向观察者（流出纸面）画 ⊙。
   方向判据：电流方向与相机前向 BZ 同向即流入纸面，即 (-d·sin pitch) > 0。
   --------------------------------------------------------------------- */
function endOnVis(){
  const sp=Math.abs(Math.sin(cam.pitch));
  /* 66° 起淡入、78° 全显。起点必须晚于右手隐去的 66°，两者在 66° 交接、互不重叠。 */
  return Math.max(0, Math.min(1, (sp-0.9135)/0.0646));
}
function buildAxisMark(d){
  const v=endOnVis();
  if(v<0.02) return;
  const c=project([0,0,0]);
  if(!c) return;
  /* 电流方向与视线前进方向同向 → 流入纸面 */
  const away=(-d*Math.sin(cam.pitch))>0;
  prims.push({t:5, d:-2e6, a:v, x:c.x, y:c.y, s:c.s, away:away});
}

   改为内嵌一张抠好背景的手部插画：

  /* 56° 之前完全不透明，66° 时已完全隐去 —— 必须早于 endOnVis() 的起点（同为 66°），
     否则手与 ⊗/⊙ 符号会同时半透明地叠在一起。 */
  return { sx:sx, sy:sy, fade:Math.max(0, Math.min(1, (sy-0.4067)/0.1525)) };
}

function buildHand(curDir){
  if(!handImg.complete || !handImg.naturalWidth) return;
  const c=project([0,0,0]);
  if(!c) return;
  const sh=handShape();
  if(sh.fade<0.02) return;
  prims.push({t:4, d:-1e6, a:sh.fade, dir:curDir, x:c.x, y:c.y, s:c.s, sx:sh.sx, sy:sh.sy});
}

function drawHand2D(pr){
  const side=HP*pr.s;
  ctx.save();
  ctx.globalAlpha=pr.a;
  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality='high';
  ctx.translate(pr.x, pr.y);
  ctx.rotate(cam.roll);            /* 相机滚转 → 手握着导线，要跟着一起转 */
  ctx.scale(pr.sx, pr.sy);         /* 随视角透视缩短（绕握持点缩放） */
  ctx.scale(-1, 1);                /* 贴图原件是左手，镜像后才是右手，四指绕向也才与 B 一致 */
  if(pr.dir<0) ctx.scale(-1,-1);   /* 反向电流 → 绕视线轴转 180°：拇指朝下、四指绕向相反，仍是右手 */
  ctx.drawImage(handImg, -HPX*side, -HPY*side, side, side);
  ctx.restore();

  /* 小标注：说明这是右手（该视角下掌心朝向观察者，所以拇指看起来在右侧），
     免得被误认成左手。手形不完整或开始淡出时隐藏。 */
  const ka=(pr.a-0.55)/0.45;
  if(ka>0.02 && pr.sy>0.45 && endOnVis()<0.02){
    /* 标注始终挂到手的外侧，随滚转一起绕握持点转（文字本身保持水平可读） */
    const ax=Math.abs(Math.sin(cam.roll)), ay=Math.abs(Math.cos(cam.roll));
    const off=ax*(pr.sx*0.55*side+10)+ay*(pr.sy*(1-HPY)*side+12);
    const tx=pr.x-Math.sin(cam.roll)*off, ty=pr.y+Math.cos(cam.roll)*off;
    ctx.save();
    ctx.globalAlpha=pr.a*ka;
    ctx.font='700 12px system-ui,-apple-system,"PingFang SC",sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    const t='右手 · 掌心朝向观察者';
    const w=ctx.measureText(t).width;
    rrect(tx-w/2-9, ty-11, w+18, 22, 11);
    ctx.fillStyle='rgba(255,255,255,.88)'; ctx.fill();
    ctx.fillStyle='#a16207';
    ctx.fillText(t, tx, ty+0.5);
    ctx.restore();
  }
}

/* --- 俯视符号：⊗ 电流流入纸面 / ⊙ 电流流出纸面 --------------------------- */
function rrect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);   ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);       ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function drawAxisMark(pr){
  /* ---- 侧视：磁感线穿进/穿出纸面的小记号（蓝）----
     圆环被视线压成一条线时，箭头会自相矛盾，这里换课本的 ⊗/⊙：
     一侧 B 进纸面、另一侧出纸面，方向不含糊。 */
  if(pr.style==='fld'){
    const R=0.235*pr.s;
    ctx.save();
    ctx.translate(pr.x,pr.y); ctx.globalAlpha=pr.a; ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(0,0,R,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,.95)'; ctx.fill();
    ctx.lineWidth=Math.max(1.5,R*0.16); ctx.strokeStyle='#93b8f5'; ctx.stroke();
    ctx.strokeStyle='#2563eb';
    if(pr.away){
      const L=R*0.44;
      ctx.lineWidth=Math.max(1.8,R*0.20);
      ctx.beginPath();
      ctx.moveTo(-L,-L); ctx.lineTo(L,L);
      ctx.moveTo(-L, L); ctx.lineTo(L,-L);
      ctx.stroke();
    }else{
      ctx.beginPath(); ctx.arc(0,0,R*0.29,0,Math.PI*2); ctx.fillStyle='#2563eb'; ctx.fill();
    }
    ctx.restore(); return;
  }
  /* ---- 侧视记号的图例 ---- */
  if(pr.style==='fldnote'){
    const FONT='system-ui,-apple-system,"PingFang SC",sans-serif';
    const fs=15;
    const txt='⊙ B 指向纸面外（朝向你）　⊗ B 指向纸面内（远离你）　—— 圆环压成一条线时，方向只看这几个记号';
    ctx.save();
    ctx.globalAlpha=pr.a;
    ctx.font='600 '+fs+'px '+FONT;
    const tw=ctx.measureText(txt).width;
    rrect(pr.x-tw/2-14, pr.y-fs*0.95, tw+28, fs*1.9, fs*0.55);
    ctx.fillStyle='rgba(255,255,255,.92)'; ctx.fill();
    ctx.fillStyle='#475569';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(txt, pr.x, pr.y);
    ctx.restore(); return;
  }
  const R=0.52*pr.s;
  ctx.save();
  ctx.translate(pr.x, pr.y);
  ctx.globalAlpha=pr.a;
  ctx.lineJoin='round';
  /* 白色底盘：压住收缩成一点的导线与电流粒子 */
  ctx.beginPath(); ctx.arc(0,0,R,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,.95)'; ctx.fill();
  ctx.lineWidth=Math.max(1.8,R*0.13); ctx.strokeStyle=AMBER; ctx.stroke();
  /* 符号本体 */
  ctx.lineCap='round'; ctx.strokeStyle='#e8890c';
  if(pr.away){
    const L=R*0.50;
    ctx.lineWidth=Math.max(2.4,R*0.18);
    ctx.beginPath();
    ctx.moveTo(-L,-L); ctx.lineTo(L,L);
    ctx.moveTo(-L, L); ctx.lineTo(L,-L);
    ctx.stroke();
  }else{
    ctx.beginPath(); ctx.arc(0,0,R*0.30,0,Math.PI*2);
    ctx.fillStyle='#e8890c'; ctx.fill();
  }
  /* 说明文字：放在最外圈磁感线之外，避免横向切断圆环 */
  const txt=pr.away?'电流流入纸面（远离你）':'电流流出纸面（朝向你）';
  const fs=Math.max(12, Math.round(R*0.46));
  ctx.font='700 '+fs+'px system-ui,-apple-system,"PingFang SC",sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const tw=ctx.measureText(txt).width, ty=R*(Math.max(...RING_R)/0.52)+R*0.52+fs*0.5;
  rrect(-tw/2-10, ty-fs*0.80, tw+20, fs*1.60, fs*0.5);
  ctx.fillStyle='rgba(255,255,255,.90)'; ctx.fill();
  ctx.fillStyle='#b45309';
  ctx.fillText(txt, 0, ty);
  ctx.restore();
}
/* ============================ 绘制 ============================ */
function draw(){
  ctx.clearRect(0,0,W,H);
  prims.sort((p,q)=>q.d-p.d);
  ctx.lineCap='round'; ctx.lineJoin='round';

  for(let i=0;i<prims.length;i++){
    const pr=prims[i];
    if(pr.t===0){
      const w=Math.max(0.7, pr.w*(pr.a.s+pr.b.s)/2);
      if(w>90) continue;
      ctx.globalAlpha=pr.alpha;
      if(pr.glow){
        ctx.strokeStyle=pr.glow; ctx.lineWidth=w*2.6; ctx.globalAlpha=pr.alpha*0.35;
        ctx.beginPath(); ctx.moveTo(pr.a.x,pr.a.y); ctx.lineTo(pr.b.x,pr.b.y); ctx.stroke();
        ctx.globalAlpha=pr.alpha;
      }
      ctx.strokeStyle=pr.c; ctx.lineWidth=w;
      ctx.beginPath(); ctx.moveTo(pr.a.x,pr.a.y); ctx.lineTo(pr.b.x,pr.b.y); ctx.stroke();
      ctx.globalAlpha=1;
    }else if(pr.t===1){
      ctx.globalAlpha=(pr.a===undefined?1:pr.a);
      ctx.fillStyle=pr.c;
      ctx.beginPath();
      ctx.moveTo(pr.p[0].x,pr.p[0].y);
      ctx.lineTo(pr.p[1].x,pr.p[1].y);
      ctx.lineTo(pr.p[2].x,pr.p[2].y);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha=1;
    }else if(pr.t===2){
      ctx.globalAlpha=(pr.a===undefined?1:pr.a);
      ctx.font=pr.font; ctx.fillStyle=pr.c;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(pr.txt,pr.x,pr.y);
      ctx.globalAlpha=1;
    }else if(pr.t===3){
      ctx.beginPath();
      ctx.moveTo(pr.p[0].x,pr.p[0].y);
      for(let k=1;k<pr.p.length;k++) ctx.lineTo(pr.p[k].x,pr.p[k].y);
      ctx.closePath();
      ctx.fillStyle=pr.c; ctx.fill();
      if(pr.s){ ctx.strokeStyle=pr.s; ctx.lineWidth=1.1; ctx.stroke(); }   /* 补掉相邻面的抗锯齿缝 */
    }else if(pr.t===4){
      drawHand2D(pr);                       /* 内嵌插画手（屏幕空间） */
    }else if(pr.t===5){
      drawAxisMark(pr);                     /* 俯视：叉进点出 */
    }
  }
}

/* ============================ 主循环 ============================ */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(st.playing) st.t+=dt;
  if(!dragging && !pinch && !dialDrag) inertia(dt);   /* 松手后靠惯性继续滑行 */
  const k=Math.min(1, dt*11);                 /* 吸附回位用（拖动中 T 与实值同步，等于不生效） */
  cam.roll  += (cam.rollT -cam.roll )*k;
  cam.pitch += (cam.pitchT-cam.pitch)*k;
  trackPole();                                /* 越过极点就补一次滚转，画面不断线 */
  updateCam();
  syncRollUI();                               /* 画面方向：按钮状态 + 转向盘指针 */
  buildScene();
  draw();
  requestAnimationFrame(frame);
}

/* ============================ 交互 ============================ */
/* 手感四件事：
   ① 跟手 —— 向右拖，画面就向右转（不是反过来）
   ② 横拖默认「环绕」，Shift/右键横拖才是「滚转」（把导线放平）
   ③ 松手留惯性，甩一下能继续滑；滑稳后若接近 90°/180° 再软吸附
   ④ 单指拖、双指捏合缩放与捻转、滚轮缩放、方向键、Q/E 滚转、双击复位 */
const SENS=0.0086;                       /* rad / px，横向 */
const SENS_Y=0.0078;                     /* rad / px，纵向 */
const P90=Math.PI/2;
let dragging=false, pinch=null, mode='orbit';
let lx=0, ly=0, lt=0;
let vYaw=0, vPitch=0, vRoll=0;           /* 松手时的角速度 rad/s */
const ptrs=new Map();

/* 俯仰不再限制在 ±90°：越过极点（相机翻到物体的另一侧）时，
   屏幕右向量 r0 会随 cos(pitch) 一起翻号 —— 这是几何事实，相机是真穿了极点。
   滚转同步加 π 恰好把它抵消掉，于是画面全程连续，
   横放之后一路拖下去就能完整绕一整圈（原来是顶在 ±90° 就停住，怎么拖都过不去）。
   注意：只按「cos(pitch) 的符号变化」触发，所以俯仰刚好停在 90°（俯视按钮）
   不会误触发；同时按 2π 归约俯仰角，拖很多圈也不会让数值越滚越大。 */
let cpSign=(Math.cos(cam.pitch)>=0)?1:-1;    /* cos(pitch) 的符号：+ 表示相机在这一侧 */
function trackPole(){
  const TAU=Math.PI*2, kk=Math.round(cam.pitch/TAU);
  if(kk){ cam.pitch-=kk*TAU; cam.pitchT=cam.pitch; }        /* 等价归约：姿态完全不变 */
  const s=(Math.cos(cam.pitch)>=0)?1:-1;
  if(s!==cpSign){ cam.roll+=Math.PI; cam.rollT=cam.roll; cpSign=s; }
}
function freeCam(){                      /* 拖动期间不做吸附：目标值与实值同步 */
  cam.rollT=cam.roll; cam.pitchT=cam.pitch;
}

/* --- 屏幕对齐的转动 ---------------------------------------------------
   拖动直接改 cam.yaw（绕世界竖直轴）只在没滚转时是对的：roll=0 时世界竖直轴
   恰好等于屏幕竖直方向，手感正常；可一旦滚转成横放，世界竖直轴在屏幕上已经
   躺成水平 —— 再绕它转，横拖就变成画面上下翻滚、导线却纹丝不动，
   这就是"横放时转动不正常"。
   做法：把拖动量拆成「绕屏幕竖直方向」与「绕屏幕水平方向」两个分量
   （A、B 就是这两个轴上的转动角），再按 roll 合成 yaw / pitch 的增量：
       roll = 0    → 只剩 yaw、pitch，与原来的玩法逐位相同；
       roll = 90°  → 横拖全部落到 pitch（绕屏幕水平轴）→ 画面左右转；
                     竖拖全部落到 yaw（绕屏幕竖直轴）→ 画面上下转。
   返回增量，供惯性速度估计。 */
/* 屏幕上的滚转角。越过极点时 trackPole() 给 cam.roll 补了一次 π（用来抵消
   右向量的翻号、保画面连续），但拖动的手感不该跟着翻 —— 映射就用「扣掉那次
   补偿」的角度，于是极点两侧横拖、竖拖的方向完全一致。 */
function effRoll(){ return cpSign>0 ? cam.roll : cam.roll-Math.PI; }
function aimDrag(dx,dy){
  const A=-dx*SENS, B=-dy*SENS_Y;
  const r=effRoll();
  const cr=Math.cos(r), sr=Math.sin(r);
  const dY=A*cr+B*sr, dP=A*sr-B*cr;
  cam.yaw  +=dY;
  cam.pitch+=dP;                          /* 俯仰可以越过 ±90°，由 trackPole() 每帧收尾 */
  return [dY,dP];
}
function applyDrag(dx,dy,dt){
  let wY=0,wP=0,wR=0;
  if(mode==='roll'){ cam.roll += dx*SENS;   wR= dx*SENS/dt; }
  const d=aimDrag(mode==='roll'?0:dx, dy);
  wY=d[0]/dt; wP=d[1]/dt;
  const a=0.34, VM=6.5;                    /* 速度做点平滑并封顶：甩最猛也只多滑约 2 rad */
  const cl=v=>v>VM?VM:(v<-VM?-VM:v);
  vYaw  = cl(vYaw  *(1-a)+wY*a);
  vPitch= cl(vPitch*(1-a)+wP*a);
  vRoll = cl(vRoll *(1-a)+wR*a);
  freeCam();
}
/* 惯性滑行：指数衰减，停下来再吸附一次。
   vYaw / vPitch 本身就是 aimDrag 拆算好的 yaw / pitch 速率（已经含了 roll 的分解），
   直接累加即可 —— 横放状态下滑行的方向也是跟手的。 */
function inertia(dt){
  if(!vYaw && !vPitch && !vRoll) return;
  cam.yaw   += vYaw  *dt;
  cam.pitch += vPitch*dt;
  cam.roll  += vRoll *dt;
  const damp=Math.exp(-dt*3.2);
  vYaw*=damp; vPitch*=damp; vRoll*=damp;
  if(Math.abs(vYaw)  <0.02) vYaw  =0;
  if(Math.abs(vPitch)<0.02) vPitch=0;
  if(Math.abs(vRoll) <0.02) vRoll =0;
  if(!vYaw && !vPitch && !vRoll) snapCam();    /* 滑稳 → 吸附 */
  else freeCam();
}
/* 松手时的软吸附：手工很难正好停在 90°，接近水平/垂直就平滑归位，
   这样"把导线放平"和"精确侧视/俯视"都能一键到位。 */
function snapCam(){
  const TAU=Math.PI*2;
  if(Math.abs(cam.roll)>TAU){                 /* 转过多圈就归约（2π 的整数倍姿态完全相同，不会跳变） */
    cam.roll=((cam.roll%TAU)+TAU)%TAU;
    cam.rollT=cam.roll;                       /* 同步目标值，否则插值会反向转一整圈 */
  }
  const Q=Math.PI/2;
  const rq=Math.round(cam.roll/Q)*Q;
  if(Math.abs(cam.roll-rq)<0.10) cam.rollT=rq;      /* ≈5.7° 内吸附 → 导线精确水平 */
  const pq=Math.round(cam.pitch/Q)*Q;
  if(Math.abs(cam.pitch-pq)<0.07) cam.pitchT=pq;    /* ≈4° 内吸附 → 精确侧视/俯视 */
}

function onDown(e){
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  vYaw=vPitch=vRoll=0;
  if(ptrs.size===1){
    pinch=null; dragging=true;
    mode=(e.shiftKey||e.button===2)?'roll':'orbit';
    lx=e.clientX; ly=e.clientY; lt=e.timeStamp||performance.now();
    cvs.classList.add('grabbing');
    try{ cvs.setPointerCapture(e.pointerId); }catch(err){}
  }else{
    dragging=false; pinch=null; cvs.classList.remove('grabbing');
    if(ptrs.size===2){
      const it=Array.from(ptrs.values());
      pinch={ d:Math.hypot(it[0].x-it[1].x,it[0].y-it[1].y)||1,
              ang:Math.atan2(it[1].y-it[0].y,it[1].x-it[0].x),
              dist:cam.dist, roll:cam.roll };
    }
  }
}
function onMove(e){
  if(!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch && ptrs.size>=2){
    const it=Array.from(ptrs.values());
    const d=Math.hypot(it[0].x-it[1].x,it[0].y-it[1].y)||1;
    const ang=Math.atan2(it[1].y-it[0].y,it[1].x-it[0].x);
    cam.dist=Math.max(4.2, Math.min(17, pinch.dist*(pinch.d/d)));
    cam.roll=pinch.roll-(ang-pinch.ang);          /* 双指捻转 → 画面跟手转 */
    cam.rollT=cam.roll;
    return;
  }
  if(!dragging) return;
  const now=e.timeStamp||performance.now();
  const dt=Math.max(0.008,(now-lt)/1000); lt=now;
  applyDrag(e.clientX-lx, e.clientY-ly, dt);
  lx=e.clientX; ly=e.clientY;
}
function onUp(e){
  if(e && e.pointerId!==undefined) ptrs.delete(e.pointerId);
  try{ if(e&&e.pointerId!==undefined) cvs.releasePointerCapture(e.pointerId); }catch(err){}
  if(ptrs.size===0){
    pinch=null;
    if(dragging){ dragging=false; cvs.classList.remove('grabbing'); }
    const sp=Math.hypot(vYaw,vPitch,vRoll);
    if(sp<0.5){ vYaw=vPitch=vRoll=0; snapCam(); }  /* 慢速松手 → 直接吸附 */
    /* 快速松手 → 留着速度继续滑，滑稳后由 inertia() 吸附 */
  }else if(ptrs.size===1){                        /* 双指变单指：接着拖 */
    pinch=null; dragging=true;
    const a=Array.from(ptrs.values())[0];
    lx=a.x; ly=a.y; lt=performance.now();
    cvs.classList.add('grabbing');
  }
}
cvs.addEventListener('pointerdown',onDown);
cvs.addEventListener('pointermove',onMove);
cvs.addEventListener('pointerup',onUp);
cvs.addEventListener('pointercancel',onUp);
cvs.addEventListener('pointerleave',e=>{ if(!cvs.hasPointerCapture||!cvs.hasPointerCapture(e.pointerId)) onUp(e); });
cvs.addEventListener('contextmenu',e=>e.preventDefault());
cvs.addEventListener('wheel',e=>{
  e.preventDefault();
  cam.dist=Math.max(4.2, Math.min(17, cam.dist*Math.exp(e.deltaY*0.0011)));
},{passive:false});
cvs.addEventListener('dblclick',()=>setView('iso'));

/* 分段按钮 */
function bindSeg(id,fn){
  const box=document.getElementById(id);
  box.addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    box.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    fn(b.dataset.v);
  });
}
bindSeg('segDir',v=>{ st.dir=parseInt(v,10); });
bindSeg('segView',v=>setView(v));
bindSeg('segRoll',v=>setRoll(parseInt(v,10)));

function setView(v){
  vYaw=vPitch=vRoll=0;                      /* 预设视角：清掉惯性 */
  /* 只改环绕与俯仰，不动 roll —— 「画面方向」(横放/竖直) 是独立开关。
     否则刚把导线放平，一点「侧视」又自己立回去了，看起来就像"横不了"。 */
  if(v==='top'){    cam.yaw=0;    cam.pitch= P90; cam.dist=8.2; }
  if(v==='bottom'){ cam.yaw=0;    cam.pitch=-P90; cam.dist=8.2; }
  if(v==='iso'){    cam.yaw=1.28; cam.pitch=0.30; cam.dist=8.6; }
  if(v==='side'){   cam.yaw=0;    cam.pitch=0.00; cam.dist=8.6; }
  cam.rollT=cam.roll; cam.pitchT=cam.pitch;   /* 预设视角立即到位，不做插值 */
  const box=document.getElementById('segView');
  box.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.v===v));
  syncRollUI();
}

/* ============================ 画面滚转 ============================
   roll 是绕视线轴的滚转。只有 yaw/pitch 的轨道相机永远把世界竖直方向投成屏幕竖直方向，
   导线因此只能是竖的；加上 roll 才能让导线（轴线）转到水平。
   入口有四个，保证一定找得到：右下角转向盘 / 「画面方向」按钮 / Shift或右键拖动 / Q、E 键。
   ------------------------------------------------------------------ */
function setRoll(deg){
  vYaw=vPitch=vRoll=0;
  /* 按「屏幕上的滚转角」设定：跨过极点时 cam.roll 带过一次 π 的补偿，这里补回来 */
  cam.roll=deg*Math.PI/180+(cpSign>0?0:Math.PI);
  cam.rollT=cam.roll;
  syncRollUI();
}
function rollState(){                        /* 0=竖直  1=横放  -1=任意角 */
  let a=(cam.roll*180/Math.PI)%180; if(a<0) a+=180;
  if(a<2.5||a>177.5) return 0;
  if(Math.abs(a-90)<2.5) return 1;
  return -1;
}
let uiRoll=null, uiState=null;
function syncRollUI(){
  const deg=effRoll()*180/Math.PI;        /* 用屏幕上的实际滚转角，指针不会因极点补偿而跳半圈 */
  const key=deg.toFixed(1);
  if(key===uiRoll) return;                   /* 每帧都调用，值没变就直接返回 */
  uiRoll=key;
  if(dialBar) dialBar.setAttribute('transform','rotate('+key+' 48 48)');
  const s=rollState();
  if(s!==uiState){
    uiState=s;
    const box=document.getElementById('segRoll');
    box.querySelectorAll('button').forEach(b=>{
      b.classList.toggle('on', (b.dataset.v==='0'&&s===0)||(b.dataset.v==='90'&&s===1));
    });
  }
  const vl=document.getElementById('valRoll');
  if(vl) vl.textContent = s===0?'竖直' : s===1?'横放' : (Math.round(((deg%180)+180)%180))+'°';
}
/* 右下角转向盘：按住拖动，画面跟着手指/鼠标一起转 */
const dial=document.getElementById('dial'), dialBar=document.getElementById('dialBar');
let dialDrag=false, dialA0=0, dialR0=0;
function dialAngle(e){
  const r=dial.getBoundingClientRect();
  return Math.atan2(e.clientY-(r.top+r.height/2), e.clientX-(r.left+r.width/2));
}
if(dial){
  dial.addEventListener('pointerdown',e=>{
    dialDrag=true; vYaw=vPitch=vRoll=0;
    dialA0=dialAngle(e); dialR0=cam.roll;
    try{ dial.setPointerCapture(e.pointerId); }catch(err){}
    e.preventDefault();
  });
  dial.addEventListener('pointermove',e=>{
    if(!dialDrag) return;
    let d=dialAngle(e)-dialA0;               /* 与画面同向旋转 = 跟手 */
    while(d> Math.PI) d-=Math.PI*2;
    while(d<-Math.PI) d+=Math.PI*2;
    cam.roll=dialR0+d; cam.rollT=cam.roll;   /* 拖动中不做吸附 */
    e.preventDefault();
  });
  const dup=e=>{
    if(!dialDrag) return;
    dialDrag=false;
    try{ dial.releasePointerCapture(e.pointerId); }catch(err){}
    snapCam();                               /* 松手吸附到最近的 90° */
  };
  dial.addEventListener('pointerup',dup);
  dial.addEventListener('pointercancel',dup);
}

/* 滑块 */
const rngI=document.getElementById('rngI'), valI=document.getElementById('valI');
rngI.addEventListener('input',()=>{
  st.I=parseFloat(rngI.value);
  valI.textContent=st.I.toFixed(2)+' A';
});

/* 开关 */
function bindSw(id,key){
  const el=document.getElementById(id);
  el.addEventListener('click',()=>{
    el.classList.toggle('on');
    st[key]=el.classList.contains('on');
  });
}
bindSw('swHand','showHand');
bindSw('swField','showField');

/* 播放 */
const btnPlay=document.getElementById('btnPlay');
btnPlay.addEventListener('click',()=>{
  st.playing=!st.playing;
  btnPlay.textContent=st.playing?'暂停动画':'继续动画';
  btnPlay.classList.toggle('paused',!st.playing);
});

/* 空格键（焦点在控件上时不拦截） */
window.addEventListener('keydown',e=>{
  const t=(document.activeElement&&document.activeElement.tagName)||'';
  if(e.code==='Space' && t!=='BUTTON' && t!=='INPUT'){ e.preventDefault(); btnPlay.click(); return; }
  if(t==='INPUT'||t==='TEXTAREA') return;
  const S=0.075, k=e.key;
  const kx=S/SENS, ky=S/SENS_Y;             /* 换算成"等效拖动像素"，与拖动走同一条屏幕对齐路径 */
  if     (k==='ArrowLeft')  aimDrag(-kx, 0);    /* 画面左转 */
  else if(k==='ArrowRight') aimDrag( kx, 0);    /* 画面右转，与拖动方向一致 */
  else if(k==='ArrowUp')    aimDrag(0, -ky);
  else if(k==='ArrowDown')  aimDrag(0,  ky);
  else if(k==='q'||k==='Q') cam.roll -= S;      /* 滚转：把导线放平/竖起 */
  else if(k==='e'||k==='E') cam.roll += S;
  else if(k==='0'){ setView('iso'); return; }
  else return;
  e.preventDefault();
  vYaw=vPitch=vRoll=0; freeCam();
});

/* ============================ 启动 ============================ */
resize();
updateCam(); buildScene(); draw();
requestAnimationFrame(frame);
})();
</script>
 </body>
